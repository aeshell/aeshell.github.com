baseURL: https://aeshell.github.io/
languageCode: en-us
title: Æsh, Another Extensible SHell

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Contact ↗
      url: "https://github.com/aeshell"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/aeshell"
      params:
        icon: github
    - name: Twitter
      weight: 6
      url: "https://twitter.com/aeshell"
      params:
        icon: x-twitter

params:
  description: "Æsh - Java libraries for building powerful command-line interfaces"
  
  theme:
    default: system
    displayToggle: true
  
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo.svg
      link: /
      width: 120
      height: 50

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/aeshell/aeshell.github.com/edit/main/content"
  
  page:
    width: wide

